<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPSS Coğrafya Soru Platformu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .map-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.08); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Üst Menü / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <i data-lucide="map-pin" class="text-rose-500 w-6 h-6"></i>
        <h1 class="text-lg md:text-xl font-bold tracking-tight text-white">KPSS Coğrafya Soru Fabrikası</h1>
      </div>
      
      <!-- Navigasyon Butonları -->
      <nav class="flex items-center gap-2 overflow-x-auto py-1">
        <button onclick="switchTab('quiz')" id="tab-quiz" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-rose-600 text-white flex items-center gap-1.5 transition">
          <i data-lucide="play-circle" class="w-4 h-4"></i> Soru Çöz
        </button>
        <button onclick="switchTab('favorites')" id="tab-favorites" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1.5 transition">
          <i data-lucide="heart" class="w-4 h-4 text-pink-400"></i> Beğenilenler (<span id="fav-count">0</span>)
        </button>
        <button onclick="switchTab('wrongs')" id="tab-wrongs" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1.5 transition">
          <i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i> Yanlışlar (<span id="wrong-count">0</span>)
        </button>
        <button onclick="switchTab('corrects')" id="tab-corrects" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1.5 transition">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i> Doğrular (<span id="correct-count">0</span>)
        </button>
      </nav>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">

    <!-- 1. Soru Çözme Görünümü -->
    <div id="view-quiz" class="space-y-4">
      <!-- Skor ve İlerleme Barı -->
      <div class="flex justify-between items-center bg-slate-800/80 px-4 py-2.5 rounded-xl border border-slate-700 text-xs md:text-sm text-slate-300">
        <span id="question-category" class="font-semibold text-rose-400">Genel Coğrafya</span>
        <div class="flex items-center gap-4">
          <span>Toplam Çözülen: <strong id="total-solved" class="text-white">0</strong></span>
          <button onclick="toggleFavoriteCurrent()" id="btn-fav-current" class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition" title="Soruyu Beğen / Kaydet">
            <i data-lucide="heart" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Soru Kartı -->
      <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 md:p-7 shadow-xl space-y-6">
        
        <!-- Harita / Görsel Alanı (Varsa) -->
        <div id="map-container" class="hidden w-full bg-slate-950/70 rounded-xl p-3 border border-slate-700/60 flex flex-col items-center">
          <div class="w-full max-w-lg aspect-[16/9] relative flex items-center justify-center">
            <svg viewBox="0 0 800 400" class="w-full h-full drop-shadow-md">
              <!-- Türkiye Taslak SVG Sınırı -->
              <path d="M 50 150 Q 150 100 250 120 T 450 110 T 650 120 Q 750 140 760 210 Q 730 280 650 270 T 450 290 T 250 310 Q 100 300 60 230 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
              <!-- Dinamik Noktalar / Şeritler -->
              <g id="svg-features"></g>
            </svg>
          </div>
          <span id="map-legend" class="text-xs text-slate-400 mt-2 font-mono"></span>
        </div>

        <!-- Soru Metni -->
        <div>
          <h2 id="question-text" class="text-base md:text-lg font-medium text-slate-100 leading-relaxed"></h2>
        </div>

        <!-- Seçenekler -->
        <div id="options-container" class="grid grid-cols-1 gap-3"></div>

        <!-- Çözüm & Açıklama Kutusu -->
        <div id="explanation-box" class="hidden p-4 rounded-xl border text-sm leading-relaxed"></div>

        <!-- Sonraki Soru Butonu -->
        <div class="flex justify-end pt-2">
          <button id="btn-next" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-xl transition flex items-center gap-2">
            Sıradaki Soru <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. Liste Görünümü (Beğenilenler, Yanlışlar, Doğrular) -->
    <div id="view-list" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="list-title" class="text-lg font-bold text-white flex items-center gap-2"></h2>
        <button onclick="switchTab('quiz')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">
          Soru Çözmeye Dön
        </button>
      </div>
      <div id="list-container" class="space-y-3"></div>
    </div>

  </main>

  <script>
    // --- KPSS COĞRAFYA SORU HAVUZU & JENERATÖRÜ ---
    const questionDatabase = [
      {
        id: 1,
        category: "Akarsular",
        type: "text",
        text: "I. Boylarının kısa olması\nII. Hidroelektrik potansiyellerinin yüksek olması\nIII. Taşımacılık faaliyetine uygun olmaları\nIV. Karma rejim özelliği göstermeleri\n\nYukarıdakilerden hangileri Türkiye topraklarından doğarak <b>Basra Körfezi'ne</b> dökülen akarsular (Fırat ve Dicle) için ortak özelliktir?",
        options: ["I ve II", "I ve IV", "II ve III", "II ve IV", "III ve IV"],
        correct: 3, // D (II ve IV)
        explanation: "Fırat ve Dicle nehirleri yüksek dağlık alanlardan doğup derin vadilerden aktıkları için hidroelektrik potansiyelleri çok yüksektir (II). Ayrıca farklı iklim bölgelerinden geçtikleri ve karların erimesiyle beslendikleri için karma rejim gösterirler (IV). Türkiye sınırları dışına çıktıkları için boyları kısa değildir; debi rejimleri düzensiz ve eğim yüksek olduğu için taşımacılığa elverişli değillerdir."
      },
      {
        id: 2,
        category: "Fay Hatları & Deprem",
        type: "text",
        text: "Türkiye'deki önemli aktif fay sistemlerinden biri de <b>Doğu Anadolu Fay Hattı (DAF)</b>'dır.\n\nAşağıdakilerden hangisi bu fay sistemi üzerinde yer alan illerden biri <u>değildir</u>?",
        options: ["Kahramanmaraş", "Malatya", "Bingöl", "Erzincan", "Elâzığ"],
        correct: 3, // D (Erzincan)
        explanation: "Erzincan ili <b>Kuzey Anadolu Fay Hattı (KAF)</b> üzerinde yer almaktadır. Kahramanmaraş, Malatya, Elâzığ ve Bingöl (Karlıova kesişimi) ise Doğu Anadolu Fay Hattı kuşağındadır."
      },
      {
        id: 3,
        category: "Göller & Oluşumları",
        type: "text",
        text: "Türkiye'deki göllerin oluşum kökenleri dikkate alındığında aşağıdaki eşleştirmelerden hangisi <b>yanlıştır</b>?",
        options: [
          "Nemrut Gölü - Volkanik (Kaldera)",
          "Tuz Gölü - Tektonik",
          "Meke Gölü - Volkanik (Maar)",
          "Avlan Gölü - Karstik",
          "Köyceğiz Gölü - Tektonik"
        ],
        correct: 4, // E (Köyceğiz)
        explanation: "Köyceğiz Gölü tektonik değil, <b>Alüvyal Set</b> gölüdür. (Muğla Dalaman çayının getirdiği alüvyonların koy önünü kapatmasıyla oluşmuştur)."
      },
      {
        id: 4,
        category: "Göller ve Oluşum Kökenleri",
        type: "text",
        text: "I. Çıldır Gölü - Karstik\nII. Erçek Gölü - Lav seti\nIII. Hazar Gölü - Tektonik\n\nAşağıda yer alan göller ve oluşumu eşleştirmelerinden hangilerinin <b>doğru</b> olduğu söylenebilir?",
        options: ["I ve II", "I ve III", "II ve III", "Yalnız II", "Yalnız III"],
        correct: 2, // C (II ve III)
        explanation: "Erçek Gölü lav set gölüdür, Hazar Gölü (Elazığ) tektonik göldür. Çıldır Gölü ise karstik değil, <b>Lav Seti</b> gölüdür."
      },
      {
        id: 5,
        category: "Haritalı / Jeomorfoloji",
        type: "map",
        mapData: {
          points: [
            { x: 230, y: 190, label: "Kula" },
            { x: 420, y: 220, label: "Karadağ-Karacadağ" },
            { x: 470, y: 200, label: "Erciyes-Hasan" },
            { x: 670, y: 190, label: "Nemrut-Süphan-Ağrı" }
          ],
          color: "#ef4444",
          legend: "Kırmızı taranmış alanlar: Türkiye'deki genç volkanik çıkış alanları"
        },
        text: "Aşağıdaki haritada bazı alanlar kırmızı renkle gösterilmiştir.\n\nBu alanların aşağıdaki coğrafi unsurlardan hangisinin dağılışını gösterdiği söylenebilir?",
        options: [
          "Volkanik sahaların yaygın olduğu yerler",
          "Tektonik kökenli göllerin yaygın olduğu yerler",
          "Buzulların etkisinde kalan sahalar",
          "Karstlaşmanın etkisinde kalan sahalar",
          "Kızılçam ormanlarının yaygın olduğu yerler"
        ],
        correct: 0, // A
        explanation: "Haritada Manisa Kula çevresi, İç Anadolu volkanik hattı (Hasandağı, Erciyes vb.) ve Doğu Anadolu volkan dizilimi (Nemrut, Süphan, Tendürek, Ağrı) gösterilmiştir. Bunlar Türkiye'deki başlıca genç volkanik arazilerdir."
      },
      {
        id: 6,
        category: "Dağ Oluşumları (Orojenez & Volkanizma)",
        type: "text",
        text: "Bir dağcılık kulübü araştırma grupları planlamaktadır:\n• <b>I. Grup:</b> Volkanik faaliyetler sonucu oluşmuş dağlık alanda gözlem yapacaktır.\n• <b>II. Grup:</b> Buzul şekillerinin görüldüğü dağlık alanlarda incelemelerde bulunacaktır.\n• <b>III. Grup:</b> Büyük horst yapılarından biri olan kırık dağlık alanda araştırma yapacaktır.\n\nBuna göre bu grupların sırasıyla hangi dağlara gitmesi gerekir?",
        options: [
          "I: Hasan Dağı | II: Hakkâri (Cilo) Dağları | III: Yunt Dağı",
          "I: Canik Dağları | II: Madra Dağı | III: Sultan Dağları",
          "I: Tahtalı Dağları | II: Ağrı Dağı | III: Aydın Dağları",
          "I: Menteşe Dağları | II: Karçal Dağı | III: Bozdağlar",
          "I: Süphan Dağı | II: Yıldız Dağları | III: Bolkar Dağları"
        ],
        correct: 0, // A
        explanation: "Hasan Dağı volkanik dağdır (I. Grup). Hakkâri Cilo (Buzul) Dağları Türkiye'de buzul aşınım ve birikim şekillerinin en belirgin olduğu yerdir (II. Grup). Ege'deki Yunt Dağı ise kırılma sonucu yükselen bir horstur (III. Grup)."
      },
      {
        id: 7,
        category: "Platolar ve Aşınım",
        type: "map",
        mapData: {
          points: [
            { x: 170, y: 115, label: "I (Çatalca-Kocaeli)" },
            { x: 190, y: 240, label: "II (Yazılıkaya)" },
            { x: 420, y: 220, label: "III (Cihanbeyli/Haymana)" },
            { x: 330, y: 310, label: "IV (Taşeli)" },
            { x: 670, y: 150, label: "V (Erzurum-Kars)" }
          ],
          color: "#38bdf8",
          legend: "Numaralandırılmış plato sahaları"
        },
        text: "Türkiye'de aşınım düzlüğü (peneplenleşmiş) niteliği taşıyan, ortalama yükseltisi en az olan ve sanayileşmenin en yoğun olduğu plato alanı haritada kaç numarayla gösterilmiştir?",
        options: ["I", "II", "III", "IV", "V"],
        correct: 0, // A (I - Çatalca Kocaeli)
        explanation: "Çatalca-Kocaeli platosu (I) Türkiye'nin en alçak aşınım platosudur. Sanayi, nüfus ve yerleşmenin en yoğun olduğu platodur. Erzurum-Kars (V) ise lav platosudur ve en yüksek platodur."
      },
      {
        id: 8,
        category: "Dağlık ve Engebeli Araziler",
        type: "map",
        mapData: {
          points: [
            { x: 200, y: 90, label: "I (Ergene)" },
            { x: 390, y: 220, label: "II (Tuz Gölü Çevresi)" },
            { x: 260, y: 300, label: "III (Teke)" },
            { x: 490, y: 300, label: "IV (Çukurova)" },
            { x: 600, y: 290, label: "V (Güneydoğu Düzlüğü)" }
          ],
          color: "#f59e0b",
          legend: "Haritada numaralandırılmış bölgeler"
        },
        text: "Haritada numaralandırılan alanlardan hangilerinde <b>dağlık ve engebeli sahalar daha az</b> yer kaplar (Düzlük/Sade alanlardır)?",
        options: ["I ve II", "I ve III", "III ve IV", "II ve III", "III ve V"],
        correct: 0, // A (I ve II)
        explanation: "Ergene Havzası (I) ve Tuz Gölü / Konya Kapalı Havzası çevresi (II) ile Güneydoğu düzlükleri Türkiye'nin yerşekilleri en sade olan alanlarıdır. Teke-Taşeli yöresi (III) ve Doğu Karadeniz/Hakkari ise oldukça engebeli ve dağlıktır."
      },
      {
        id: 9,
        category: "Karstik Şekiller ve Platolar",
        type: "text",
        text: "Kalker (kireçtaşı) ve jips gibi suda kolay eriyebilen kayaçların bulunduğu sahalarda karstik aşınım ve birikim şekilleri oluşur.\n\nAşağıdaki platolardan hangisi <b>Karstik Oluşumlu (Kalkerli)</b> bir platodur?",
        options: ["Haymana Platosu", "Bozok Platosu", "Teke Platosu", "Ardahan Platosu", "Yazılıkaya Platosu"],
        correct: 2, // C (Teke)
        explanation: "Akdeniz kuşağında yer alan Teke ve Taşeli Platoları kalker üzerinde gelişmiş karstik platolardır. Bozok, Haymana ve Yazılıkaya tabaka düzlüğü (yatay duruşlu), Ardahan ise volkanik/lav platosudur."
      },
      {
        id: 10,
        category: "Ovalar & Oluşum Türleri",
        type: "text",
        text: "Akarsuların taşıdığı alüvyonları deniz kıyısında sığ kıyılarda biriktirmesiyle delta ovaları oluşur.\n\nAşağıdaki ova eşleştirmelerinden hangisi <b>akarsuyu ile yanlış</b> eşleştirilmiştir?",
        options: [
          "Çukurova - Seyhan ve Ceyhan",
          "Bafra Ovası - Kızılırmak",
          "Çarşamba Ovası - Yeşilırmak",
          "Silifke Ovası - Göksu",
          "Dikili Ovası - Gediz"
        ],
        correct: 4, // E (Dikili - Gediz)
        explanation: "Dikili Ovası <b>Bakırçay</b> deltasında oluşmuştur. Gediz Nehri'nin oluşturduğu delta ovası ise <b>Menemen Ovası</b>'dır."
      }
    ];

    // --- STATE YÖNETİMİ & LOCALSTORAGE ---
    let currentIndex = 0;
    let favorites = JSON.parse(localStorage.getItem('kpss_favorites') || '[]');
    let wrongs = JSON.parse(localStorage.getItem('kpss_wrongs') || '[]');
    let corrects = JSON.parse(localStorage.getItem('kpss_corrects') || '[]');
    let answeredQuestions = {};

    function saveState() {
      localStorage.setItem('kpss_favorites', JSON.stringify(favorites));
      localStorage.setItem('kpss_wrongs', JSON.stringify(wrongs));
      localStorage.setItem('kpss_corrects', JSON.stringify(corrects));
      updateCounters();
    }

    function updateCounters() {
      document.getElementById('fav-count').textContent = favorites.length;
      document.getElementById('wrong-count').textContent = wrongs.length;
      document.getElementById('correct-count').textContent = corrects.length;
      document.getElementById('total-solved').textContent = Object.keys(answeredQuestions).length;
    }

    // --- SORUYU EKRANA BASMA ---
    function renderQuestion(index) {
      currentIndex = index;
      const q = questionDatabase[index];
      
      document.getElementById('question-category').textContent = q.category;
      document.getElementById('question-text').innerHTML = q.text.replace(/\n/g, '<br>');
      
      // Favori Butonu Görünümü
      const favBtn = document.getElementById('btn-fav-current');
      if (favorites.includes(q.id)) {
        favBtn.classList.add('text-pink-500', 'bg-pink-500/20');
      } else {
        favBtn.classList.remove('text-pink-500', 'bg-pink-500/20');
      }

      // Harita Alanı
      const mapContainer = document.getElementById('map-container');
      const svgFeatures = document.getElementById('svg-features');
      svgFeatures.innerHTML = '';

      if (q.type === 'map' && q.mapData) {
        mapContainer.classList.remove('hidden');
        document.getElementById('map-legend').textContent = q.mapData.legend || '';
        
        q.mapData.points.forEach(pt => {
          // Kırmızı/Renkli Vurgu Noktaları & Animasyonlu Daireler
          const circleG = document.createElementNS("http://www.w3.org/2000/svg", "g");
          circleG.innerHTML = `
            <circle cx="${pt.x}" cy="${pt.y}" r="14" fill="${q.mapData.color}" opacity="0.4" class="map-pulse" />
            <circle cx="${pt.x}" cy="${pt.y}" r="8" fill="${q.mapData.color}" stroke="#ffffff" stroke-width="1.5" />
            <text x="${pt.x}" y="${pt.y - 14}" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" class="select-none filter drop-shadow">${pt.label}</text>
          `;
          svgFeatures.appendChild(circleG);
        });
      } else {
        mapContainer.classList.add('hidden');
      }

      // Seçenekleri Oluştur
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl bg-slate-750 bg-slate-700/60 hover:bg-slate-700 border border-slate-600/60 transition flex items-start gap-3 text-sm md:text-base group";
        btn.id = `opt-${idx}`;
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-300 group-hover:border-rose-400 shrink-0">
            ${letters[idx]}
          </span>
          <span class="flex-1">${opt}</span>
        `;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      // Açıklama ve Sıradaki Butonunu Sıfırla
      document.getElementById('explanation-box').className = "hidden";
      document.getElementById('btn-next').classList.add('hidden');
    }

    // --- CEVAP KONTROLÜ ---
    function selectAnswer(selectedIdx) {
      const q = questionDatabase[currentIndex];
      const isCorrect = selectedIdx === q.correct;
      answeredQuestions[q.id] = isCorrect;

      // Yanlış / Doğru Dizilerini Güncelle
      if (isCorrect) {
        if (!corrects.includes(q.id)) corrects.push(q.id);
        wrongs = wrongs.filter(id => id !== q.id);
      } else {
        if (!wrongs.includes(q.id)) wrongs.push(q.id);
        corrects = corrects.filter(id => id !== q.id);
      }
      saveState();

      // Butonları Renklendir
      q.options.forEach((_, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        if (idx === q.correct) {
          btn.className = "w-full text-left p-3.5 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-100 flex items-start gap-3 text-sm md:text-base";
        } else if (idx === selectedIdx && !isCorrect) {
          btn.className = "w-full text-left p-3.5 rounded-xl bg-rose-950/80 border-2 border-rose-500 text-rose-100 flex items-start gap-3 text-sm md:text-base";
        } else {
          btn.className = "w-full text-left p-3.5 rounded-xl bg-slate-800/40 border border-slate-700/50 text-slate-500 opacity-60 flex items-start gap-3 text-sm md:text-base";
        }
      });

      // Açıklama Kutusunu Göster
      const expBox = document.getElementById('explanation-box');
      expBox.className = `p-4 rounded-xl border text-sm leading-relaxed ${isCorrect ? 'bg-emerald-900/30 border-emerald-700 text-emerald-200' : 'bg-rose-900/30 border-rose-700 text-rose-200'}`;
      expBox.innerHTML = `
        <div class="font-bold flex items-center gap-1.5 mb-1">
          <i data-lucide="${isCorrect ? 'check-circle' : 'alert-triangle'}" class="w-4 h-4"></i>
          ${isCorrect ? 'Tebrikler, Doğru Cevap!' : 'Yanlış Cevap!'}
        </div>
        <div>${q.explanation}</div>
      `;
      expBox.classList.remove('hidden');

      document.getElementById('btn-next').classList.remove('hidden');
      lucide.createIcons();
    }

    function nextQuestion() {
      const nextIdx = (currentIndex + 1) % questionDatabase.length;
      renderQuestion(nextIdx);
    }

    function toggleFavoriteCurrent() {
      const q = questionDatabase[currentIndex];
      if (favorites.includes(q.id)) {
        favorites = favorites.filter(id => id !== q.id);
      } else {
        favorites.push(q.id);
      }
      saveState();
      renderQuestion(currentIndex);
    }

    // --- SEKMELER VE LİSTE GÖRÜNÜMÜ ---
    function switchTab(tab) {
      const tabs = ['quiz', 'favorites', 'wrongs', 'corrects'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-rose-600 text-white flex items-center gap-1.5 transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1.5 transition";
        }
      });

      const viewQuiz = document.getElementById('view-quiz');
      const viewList = document.getElementById('view-list');

      if (tab === 'quiz') {
        viewQuiz.classList.remove('hidden');
        viewList.classList.add('hidden');
      } else {
        viewQuiz.classList.add('hidden');
        viewList.classList.remove('hidden');
        renderFilteredList(tab);
      }
    }

    function renderFilteredList(type) {
      const listContainer = document.getElementById('list-container');
      const listTitle = document.getElementById('list-title');
      listContainer.innerHTML = '';

      let targetIds = [];
      let icon = '';
      let colorClass = '';

      if (type === 'favorites') {
        targetIds = favorites;
        listTitle.innerHTML = `<i data-lucide="heart" class="text-pink-400"></i> Beğenilen / Kaydedilen Sorular (${targetIds.length})`;
      } else if (type === 'wrongs') {
        targetIds = wrongs;
        listTitle.innerHTML = `<i data-lucide="x-circle" class="text-rose-400"></i> Yanlış Yapılan Sorular (${targetIds.length})`;
      } else if (type === 'corrects') {
        targetIds = corrects;
        listTitle.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-400"></i> Doğru Yapılan Sorular (${targetIds.length})`;
      }

      if (targetIds.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center bg-slate-800 rounded-xl border border-slate-700 text-slate-400">
            Henüz bu kategoride soru bulunmuyor.
          </div>
        `;
        lucide.createIcons();
        return;
      }

      targetIds.forEach(id => {
        const qIndex = questionDatabase.findIndex(item => item.id === id);
        const q = questionDatabase[qIndex];
        if (!q) return;

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2 hover:border-slate-500 transition";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <span class="text-xs bg-slate-700 text-rose-300 px-2 py-0.5 rounded font-mono">${q.category}</span>
            <button onclick="goToQuestion(${qIndex})" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg">
              Bu Soruyu Çöz
            </button>
          </div>
          <p class="text-sm font-medium text-slate-200 line-clamp-2">${q.text.replace(/<[^>]*>?/gm, '')}</p>
        `;
        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    function goToQuestion(index) {
      switchTab('quiz');
      renderQuestion(index);
    }

    // Uygulamayı Başlat
    window.onload = () => {
      updateCounters();
      renderQuestion(0);
      lucide.createIcons();
    };
  </script>
</body>
</html>
