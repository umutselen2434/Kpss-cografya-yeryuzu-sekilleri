<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPSS Coğrafya Soru Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .map-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(1.3); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Üst Menü / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <i data-lucide="compass" class="text-rose-500 w-6 h-6"></i>
        <h1 class="text-base md:text-lg font-bold text-white tracking-tight">KPSS Coğrafya</h1>
      </div>
      
      <!-- Sekme Butonları -->
      <nav class="flex items-center gap-1.5 overflow-x-auto">
        <button onclick="switchTab('quiz')" id="tab-quiz" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-rose-600 text-white flex items-center gap-1">
          <i data-lucide="play-circle" class="w-4 h-4"></i> Soru Çöz
        </button>
        <button onclick="switchTab('favorites')" id="tab-favorites" class="px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1">
          <i data-lucide="heart" class="w-4 h-4 text-pink-400"></i> Beğenilen (<span id="fav-count">0</span>)
        </button>
        <button onclick="switchTab('wrongs')" id="tab-wrongs" class="px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1">
          <i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i> Yanlışlar (<span id="wrong-count">0</span>)
        </button>
        <button onclick="switchTab('corrects')" id="tab-corrects" class="px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i> Doğrular (<span id="correct-count">0</span>)
        </button>
      </nav>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-3xl w-full mx-auto p-4 flex-1 flex flex-col justify-start">

    <!-- 1. Soru Çözüm Ekranı -->
    <div id="view-quiz" class="space-y-3">
      
      <!-- Soru Bilgi Çubuğu -->
      <div class="flex justify-between items-center bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 text-xs md:text-sm">
        <span id="question-category" class="font-bold text-rose-400 font-mono"></span>
        <div class="flex items-center gap-3">
          <button onclick="toggleFavorite()" id="btn-fav" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition">
            <i data-lucide="heart" id="fav-icon" class="w-4 h-4 text-pink-400"></i>
            <span id="fav-text">Beğen</span>
          </button>
          <span class="text-slate-400">Çözülen: <strong id="total-solved" class="text-white font-bold">0</strong></span>
        </div>
      </div>

      <!-- Soru Kartı -->
      <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 md:p-6 shadow-xl space-y-4">
        
        <!-- Detaylı Türkiye Haritası Alanı -->
        <div id="map-container" class="hidden w-full bg-slate-950/90 rounded-xl p-3 border border-slate-700/60 flex flex-col items-center">
          <div class="w-full max-w-lg aspect-[16/9] relative flex items-center justify-center">
            <svg viewBox="0 0 1000 480" class="w-full h-full drop-shadow-lg">
              <!-- Türkiye Kıyı ve Sınır Çizgisi -->
              <path d="M 120 85 Q 160 80 190 120 L 210 135 Q 230 145 220 160 L 195 180 Q 180 190 160 170 L 130 200 Q 110 230 120 270 L 150 280 Q 170 320 200 310 L 230 330 Q 280 340 310 390 L 330 420 Q 360 410 380 370 L 410 375 Q 460 380 500 370 L 530 320 Q 560 330 610 380 L 640 400 Q 680 430 730 410 L 800 420 Q 860 410 880 380 L 920 370 Q 960 330 950 290 L 970 240 Q 950 180 920 160 L 890 140 Q 840 120 800 130 L 760 110 Q 720 80 670 90 L 620 105 Q 580 85 530 95 L 480 85 Q 420 80 380 95 L 340 110 Q 290 100 240 90 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
              <!-- Van Gölü & Tuz Gölü -->
              <ellipse cx="880" cy="270" rx="28" ry="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
              <ellipse cx="480" cy="250" rx="22" ry="32" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
              <!-- Dinamik Noktalar -->
              <g id="svg-features"></g>
            </svg>
          </div>
          <span id="map-legend" class="text-xs text-rose-400 mt-2 font-mono font-medium"></span>
        </div>

        <!-- Soru Başlığı / Metni -->
        <h2 id="question-text" class="text-sm md:text-base font-medium text-slate-100 leading-relaxed"></h2>

        <!-- Şıklar -->
        <div id="options-container" class="grid grid-cols-1 gap-2.5"></div>

        <!-- Açıklama Alanı -->
        <div id="explanation-box" class="hidden p-3.5 rounded-xl border text-xs md:text-sm leading-relaxed"></div>

        <!-- Sonraki Soru Butonu -->
        <div class="flex justify-end pt-1">
          <button id="btn-next" onclick="nextQuestion()" class="hidden px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-sm rounded-xl transition flex items-center gap-1.5">
            Sonraki Soru <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. Listeler Ekranı (Beğenilenler / Yanlışlar / Doğrular) -->
    <div id="view-list" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 id="list-title" class="text-base font-bold text-white flex items-center gap-2"></h2>
        <button onclick="switchTab('quiz')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">
          Soru Çözümüne Dön
        </button>
      </div>
      <div id="list-container" class="space-y-2.5"></div>
    </div>

  </main>

  <script>
    // GENİŞLETİLMİŞ KPSS COĞRAFYA VERİTABANI
    const geographyData = {
      mountains: {
        volcanic: ["Nemrut", "Süphan", "Tendürek", "Ağrı Dağı", "Erciyes", "Hasan Dağı", "Melendiz", "Karadağ", "Karacadağ", "Kula Volkanları"],
        orogenic_horst: ["Kaz Dağları", "Madra Dağı", "Yunt Dağı", "Bozdağlar", "Aydın Dağları", "Menteşe Dağları", "Amanos (Nur) Dağları"],
        orogenic_fold: ["Toros Dağları", "Kaçkar Dağları", "Küre Dağları", "Ilgaz Dağları", "Bolu Dağları", "Yıldız Dağları", "Canik Dağları", "Geyik Dağları"]
      },
      plateaus: {
        volcanic: ["Erzurum-Kars Platosu", "Ardahan Platosu", "Kapadokya Platosu"],
        karstic_kalker: ["Teke Platosu", "Taşeli Platosu"],
        tabaka: ["Haymana Platosu", "Cihanbeyli Platosu", "Bozok Platosu", "Obruk Platosu", "Uzunyayla Platosu", "Gaziantep Platosu", "Şanlıurfa Platosu"],
        erosion: ["Çatalca-Kocaeli Platosu", "Perşembe Yaylası"]
      },
      lakes: {
        karstic: ["Salda Gölü", "Avlan Gölü", "Kestel Gölü", "Elmalı Gölü", "Suğla Gölü", "Kızılören Gölü"],
        volcanic: ["Meke Maar Gölü", "Nemrut Krater Gölü", "Gölcük (Isparta)"],
        tectonic: ["Tuz Gölü", "Beyşehir Gölü", "Eğirdir Gölü", "İznik Gölü", "Manyas Gölü", "Sapanca Gölü", "Hazar Gölü", "Akşehir Gölü", "Burdur Gölü"],
        set_landslide: ["Tortum Gölü", "Abant Gölü", "Yedigöller", "Sera Gölü", "Zinav Gölü", "Borabay Gölü"],
        set_alluvial: ["Köyceğiz Gölü", "Bafa (Çamiçi) Gölü", "Mogan Gölü", "Eymir Gölü", "Marmara Gölü"],
        set_volcanic: ["Van Gölü", "Erçek Gölü", "Nazik Gölü", "Balık Gölü", "Çıldır Gölü", "Haçlı Gölü"],
        set_coastal: ["Büyükçekmece Gölü", "Küçükçekmece Gölü", "Terkos (Durusu) Gölü"]
      },
      plains: {
        delta: ["Çukurova (Seyhan-Ceyhan)", "Bafra (Kızılırmak)", "Çarşamba (Yeşilırmak)", "Silifke (Göksu)", "Menemen (Gediz)", "Balat (B.Menderes)", "Dikili (Bakırçay)"],
        karstic: ["Tefenni Ovası", "Acıpayam Ovası", "Korkuteli Ovası", "Muğla Ovası", "Elmalı Ovası", "Kestel Ovası"],
        tectonic: ["Ergene Ovası", "Amik Ovası", "Konya Ovası", "Düzce Ovası", "Niksar Ovası", "Erzincan Ovası", "Muş Ovası"]
      },
      geologicTimes: [
        { time: "Birinci Jeolojik Zaman (Paleozoyik)", events: ["Zonguldak-Amasra taş kömürü yataklarının oluşumu", "Masif (yaşlı ve sert) arazilerin meydana gelmesi", "Kaledoniyen ve Herseniyen kıvrımlarının oluşması"] },
        { time: "Üçüncü Jeolojik Zaman (Tersiyer / Senozoyik)", events: ["Soma, Yatağan ve Elbistan linyit yataklarının oluşumu", "Kırka ve Seyitgazi bor yataklarının oluşumu", "Petrol ve kaya tuzu yataklarının oluşumu", "Toroslar ve Kuzey Anadolu Dağları'nın (Alp Orojenezi) kıvrılması"] },
        { time: "Dördüncü Jeolojik Zaman (Kuvaterner)", events: ["Egeid karasının çökmesi ve Ege Denizi'nin oluşumu", "İstanbul ve Çanakkale boğazlarının oluşumu", "Karadeniz'in göl halinden deniz haline gelmesi", "Buzul çağları ve insan topluluklarının ortaya çıkışı"] }
      ],
      mapScenarios: [
        {
          category: "Volkanik Alanlar / Harita",
          points: [
            { x: 250, y: 240, label: "" },
            { x: 500, y: 310, label: "" },
            { x: 570, y: 260, label: "" },
            { x: 860, y: 230, label: "" },
            { x: 920, y: 190, label: "" }
          ],
          text: "Yukarıdaki Türkiye haritasında kırmızı işaretlerle taranarak gösterilen alanların ortak jeolojik/morfolojik özelliği aşağıdakilerden hangisidir?",
          options: ["Genç volkanik araziler ve volkan dağları olmaları", "Buzul aşındırmasının etkili olduğu sahalar olmaları", "Karstik aşınım platoları olmaları", "Taş kömürü yataklarının yaygın olması", "Delta ovalarından oluşmaları"],
          correct: 0,
          explanation: "Haritada Manisa Kula, İç Anadolu volkanik hattı (Karadağ, Hasandağı, Erciyes) ve Doğu Anadolu volkan dizilimi (Nemrut, Süphan, Ağrı) işaretlenmiştir. Bunlar Türkiye'deki genç volkanik çıkış alanlarıdır."
        },
        {
          category: "Kıyı Tipleri / Harita",
          points: [
            { x: 220, y: 140, label: "I" },
            { x: 190, y: 175, label: "II" },
            { x: 140, y: 270, label: "III" },
            { x: 330, y: 400, label: "IV" },
            { x: 740, y: 115, label: "V" }
          ],
          text: "Haritada numaralandırılan kıyı alanlarından hangisinde <b>Dalmaçya Tipi Kıyılar</b> görülmektedir?",
          options: ["I", "II", "III", "IV", "V"],
          correct: 3, // IV
          explanation: "Dalmaçya kıyı tipi Antalya <b>Kaş - Finike kıyılarında (IV)</b> yer alır. (I: Ria - İstanbul Boğazı, II: Limanlı, III: Enine, V: Boyuna)."
        },
        {
          category: "Buzul Şekilleri / Harita",
          points: [
            { x: 170, y: 120, label: "I" },
            { x: 150, y: 260, label: "II" },
            { x: 520, y: 270, label: "III" },
            { x: 590, y: 350, label: "IV" },
            { x: 920, y: 340, label: "V" }
          ],
          text: "Haritada numaralandırılan alanların hangilerinde <b>buzul aşındırma ve biriktirme şekilleri (sirk gölleri, morenler)</b> daha yaygındır?",
          options: ["I ve II", "I ve III", "II ve IV", "III ve V", "IV ve V"],
          correct: 4, // IV ve V
          explanation: "Buzul şekilleri Türkiye'nin ortalama yükseltisi çok fazla olan yüksek dağlarında (Toroslar'daki Bolkar-Aladağlar kuşağı [IV] ve Doğu Anadolu'daki Hakkâri Cilo Dağları [V]) yaygındır."
        },
        {
          category: "Platolar / Harita",
          points: [
            { x: 220, y: 140, label: "I" },
            { x: 260, y: 250, label: "II" },
            { x: 480, y: 220, label: "III" },
            { x: 340, y: 380, label: "IV" },
            { x: 880, y: 160, label: "V" }
          ],
          text: "Haritada numaralandırılan alanlardan hangisi Türkiye'nin <b>en yüksek lav (volkanik) platosu</b> alanını göstermektedir?",
          options: ["I", "II", "III", "IV", "V"],
          correct: 4, // V (Erzurum-Kars)
          explanation: "V numaralı alan Türkiye'nin en yüksek lav platosu olan <b>Erzurum-Kars Platosu</b>'dur. (I: Çatalca-Kocaeli, II: Yazılıkaya, III: Cihanbeyli, IV: Taşeli)."
        }
      ]
    };

    // Benzersiz ve dengeli soru jeneratörü
    function generateQuestion(id, modeIndex) {
      const modes = ['map', 'jips_karst', 'human_impact', 'land_use', 'orogeny_vs_volcano', 'lava_plateau', 'geology', 'plain_delta', 'lake_shallow', 'lake_type'];
      const chosen = modes[modeIndex % modes.length];

      if (chosen === 'map') {
        const sc = geographyData.mapScenarios[id % geographyData.mapScenarios.length];
        return {
          id: id,
          category: sc.category,
          type: "map",
          mapData: { points: sc.points, color: "#ef4444", legend: "Haritada kırmızı ile işaretlenmiş alanlar" },
          text: sc.text,
          options: sc.options,
          correct: sc.correct,
          explanation: sc.explanation
        };
      }

      if (chosen === 'jips_karst') {
        const options = ["Sivas", "Diyarbakır", "Yozgat", "Giresun", "Kastamonu"].sort(() => Math.random() - 0.5);
        return {
          id: id,
          category: "Kayaç Tipleri & Karstik Şekiller",
          type: "text",
          text: "Aşağıdaki illerin hangisinde <b>jips (alçı taşı) karstına</b> ait yer şekilleri (mağaralar, dolinler) daha yaygındır?",
          options: options,
          correct: options.indexOf("Sivas"),
          explanation: "Türkiye'de jips karstı en belirgin olarak <b>Sivas, Çankırı ve Erzincan</b> çevrelerinde görülür. Akdeniz'dekiler kalker kökenlidir."
        };
      }

      if (chosen === 'human_impact') {
        return {
          id: id,
          category: "Çevre & İnsan Etkisi",
          type: "text",
          text: "I. Doğal göllerin su seviyesinin çekilmesi ve kuruması\nII. Peribacası aşınım şekillerinin oluşması\nIII. Yeraltı su seviyesinin düşmesiyle çökme obruklarının artması\n\nYukarıdakilerden hangileri <b>insanların yeraltı sularını aşırı ve bilinçsizce kullanması</b> sonucu ortaya çıkan çevre sorunlarındandır?",
          options: ["Yalnız I", "Yalnız II", "I ve III", "II ve III", "I, II ve III"],
          correct: 2,
          explanation: "Göllerin kuruması (I) ve obrukların hızla artması (III) aşırı yeraltı suyu kullanımının sonucudur. Peribacaları (II) ise tamamen doğal süreçlerle oluşur."
        };
      }

      if (chosen === 'land_use') {
        const options = [
          "Çukurova ve Gediz gibi birinci sınıf verimli ovaların sanayi ve yerleşime açılması",
          "Mera alanlarının bilinçsizce sürülüp tarıma açılması",
          "Eğimli yamaçlardaki orman örtüsünün tahrip edilip çay bahçesine dönüştürülmesi",
          "Delta ovalarının kıyı şeridine tatil köyleri inşa edilmesi",
          "Jeotermal sıcak su kaynaklarının modern seracılıkta ve konut ısıtmasında değerlendirilmesi"
        ];
        return {
          id: id,
          category: "Arazi Kullanımı",
          type: "text",
          text: "Aşağıdakilerden hangisi Türkiye'de <b>yanlış arazi kullanımına</b> örnek <u>gösterilemez</u> (Doğru ve sürdürülebilir bir kullanımdır)?",
          options: options,
          correct: 4,
          explanation: "Jeotermal enerjinin seralarda ve konutlarda kullanılması sürdürülebilir, doğru bir kaynak yönetimidir."
        };
      }

      if (chosen === 'orogeny_vs_volcano') {
        return {
          id: id,
          category: "Dağ Oluşumları (Orojenez)",
          type: "text",
          text: "I. Amanos (Nur) Dağları\nII. Erciyes Dağı\nIII. Kaçkar Dağları\n\nYukarıdaki dağlardan hangileri <b>Orojenez (levha sıkışması sonucu kırılma veya kıvrılma)</b> ile meydana gelmiştir?",
          options: ["I ve II", "I ve III", "II ve III", "Yalnız I", "I, II ve III"],
          correct: 1,
          explanation: "Amanos horst (kırık), Kaçkar ise kıvrım dağıdır; her ikisi de orojenezle oluşmuştur. Erciyes ise volkaniktir."
        };
      }

      if (chosen === 'lava_plateau') {
        const options = ["Erzurum-Kars Platosu", "Çatalca-Kocaeli Platosu", "Haymana Platosu", "Cihanbeyli Platosu", "Taşeli Platosu"].sort(() => Math.random() - 0.5);
        return {
          id: id,
          category: "Platolar",
          type: "text",
          text: "Volkanik lav örtüsünün akarsular tarafından derin yarılmasıyla oluşan <b>Lav Platosu</b> aşağıdakilerden hangisidir?",
          options: options,
          correct: options.indexOf("Erzurum-Kars Platosu"),
          explanation: "<b>Erzurum-Kars ve Ardahan Platoları</b> Türkiye'nin başlıca lav platolarıdır."
        };
      }

      if (chosen === 'geology') {
        const randObj = geographyData.geologicTimes[id % geographyData.geologicTimes.length];
        const randEvent = randObj.events[id % randObj.events.length];
        const options = ["Paleozoyik (I. Zaman)", "Mezozoyik (II. Zaman)", "Tersiyer (III. Zaman)", "Kuvaterner (IV. Zaman)", "Prekambriyen (İlkel Zaman)"].sort(() => Math.random() - 0.5);
        let target = randObj.time.includes("Birinci") ? "Paleozoyik (I. Zaman)" : (randObj.time.includes("Üçüncü") ? "Tersiyer (III. Zaman)" : "Kuvaterner (IV. Zaman)");
        return {
          id: id,
          category: "Jeolojik Zamanlar",
          type: "text",
          text: `Türkiye'de <b>"${randEvent}"</b> hangi jeolojik zamanda gerçekleşmiştir?`,
          options: options,
          correct: options.indexOf(target),
          explanation: `Bu olay <b>${randObj.time}</b> döneminde meydana gelmiştir.`
        };
      }

      if (chosen === 'plain_delta') {
        const correctDelta = geographyData.plains.delta[id % geographyData.plains.delta.length];
        const nonDeltas = [...geographyData.plains.karstic, ...geographyData.plains.tectonic].sort(() => Math.random() - 0.5).slice(0, 4);
        const options = [...nonDeltas, correctDelta].sort(() => Math.random() - 0.5);
        return {
          id: id,
          category: "Ovalar",
          type: "text",
          text: "Akarsuların denize döküldüğü yerde alüvyon biriktirmesiyle oluşan <b>Delta Ovası</b> hangisidir?",
          options: options,
          correct: options.indexOf(correctDelta),
          explanation: `<b>${correctDelta}</b> bir delta ovasıdır.`
        };
      }

      if (chosen === 'lake_shallow') {
        const options = ["Seyfe Gölü (Kırşehir)", "Abant Gölü (Bolu)", "Tortum Gölü (Erzurum)", "Büyükçekmece (İstanbul)", "Eğirdir Gölü (Isparta)"];
        return {
          id: id,
          category: "Göller & Ekoloji",
          type: "text",
          text: "Kapalı havzada yer alan, sığ yapısı nedeniyle kurak dönemde alanı çok daralan göl hangisidir?",
          options: options,
          correct: 0,
          explanation: "<b>Seyfe Gölü</b> kapalı havza tabanında yer alan sığ bir göldür."
        };
      }

      // Göl Oluşum Sorusu
      const lakeTypes = [
        { key: 'set_landslide', name: 'Heyelan Seti' },
        { key: 'set_coastal', name: 'Kıyı Set (Lagün)' },
        { key: 'karstic', name: 'Karstik' },
        { key: 'set_volcanic', name: 'Lav Seti' }
      ];
      const targetLType = lakeTypes[id % lakeTypes.length];
      const correctL = geographyData.lakes[targetLType.key][id % geographyData.lakes[targetLType.key].length];
      const otherLTypes = lakeTypes.filter(t => t.key !== targetLType.key);
      let wrongs = [];
      while (wrongs.length < 4) {
        const randT = otherLTypes[Math.floor(Math.random() * otherLTypes.length)];
        const candidate = geographyData.lakes[randT.key][Math.floor(Math.random() * geographyData.lakes[randT.key].length)];
        if (!wrongs.includes(candidate)) wrongs.push(candidate);
      }
      const lOpts = [...wrongs, correctL].sort(() => Math.random() - 0.5);
      return {
        id: id,
        category: "Göl Oluşumları",
        type: "text",
        text: `Aşağıdaki göllerden hangisi <b>${targetLType.name}</b> gölüne örnektir?`,
        options: lOpts,
        correct: lOpts.indexOf(correctL),
        explanation: `<b>${correctL}</b> bir <b>${targetLType.name}</b> gölüdür.`
      };
    }

    // --- STATE YÖNETİMİ ---
    let questionBank = JSON.parse(localStorage.getItem('kpss_qbank_v8') || '[]');
    let currentIdx = parseInt(localStorage.getItem('kpss_cur_v8') || '0', 10);
    let favorites = JSON.parse(localStorage.getItem('kpss_favs_v8') || '[]');
    let wrongs = JSON.parse(localStorage.getItem('kpss_wrongs_v8') || '[]');
    let corrects = JSON.parse(localStorage.getItem('kpss_corrects_v8') || '[]');
    let solvedCount = parseInt(localStorage.getItem('kpss_solved_v8') || '0', 10);

    // Havuz yoksa baştan 50 benzersiz soru üret
    if (questionBank.length === 0) {
      for (let i = 1; i <= 50; i++) {
        questionBank.push(generateQuestion(i, i - 1));
      }
      localStorage.setItem('kpss_qbank_v8', JSON.stringify(questionBank));
    }

    function saveState() {
      localStorage.setItem('kpss_favs_v8', JSON.stringify(favorites));
      localStorage.setItem('kpss_wrongs_v8', JSON.stringify(wrongs));
      localStorage.setItem('kpss_corrects_v8', JSON.stringify(corrects));
      localStorage.setItem('kpss_cur_v8', currentIdx.toString());
      localStorage.setItem('kpss_qbank_v8', JSON.stringify(questionBank));
      localStorage.setItem('kpss_solved_v8', solvedCount.toString());
      updateCounters();
    }

    function updateCounters() {
      document.getElementById('fav-count').textContent = favorites.length;
      document.getElementById('wrong-count').textContent = wrongs.length;
      document.getElementById('correct-count').textContent = corrects.length;
      document.getElementById('total-solved').textContent = solvedCount;

      const currentQ = questionBank[currentIdx];
      const favIcon = document.getElementById('fav-icon');
      const favText = document.getElementById('fav-text');
      if (currentQ && favorites.includes(currentQ.id)) {
        favIcon.setAttribute('fill', 'currentColor');
        favText.textContent = "Beğenildi";
      } else {
        favIcon.removeAttribute('fill');
        favText.textContent = "Beğen";
      }
    }

    function renderQuestion(index) {
      if (index >= questionBank.length) {
        questionBank.push(generateQuestion(questionBank.length + 1, questionBank.length));
      }

      currentIdx = index;
      saveState();

      const q = questionBank[index];
      document.getElementById('question-category').textContent = q.category;
      document.getElementById('question-text').innerHTML = q.text.replace(/\n/g, '<br>');

      // Harita Alanı
      const mapContainer = document.getElementById('map-container');
      const svgFeatures = document.getElementById('svg-features');
      svgFeatures.innerHTML = '';

      if (q.type === 'map' && q.mapData) {
        mapContainer.classList.remove('hidden');
        document.getElementById('map-legend').textContent = q.mapData.legend || '';
        
        q.mapData.points.forEach(pt => {
          const circleG = document.createElementNS("http://www.w3.org/2000/svg", "g");
          // Sadece numara varsa text yaz, yoksa temiz kırmızı nokta bas
          const labelSvg = pt.label ? `<text x="${pt.x}" y="${pt.y - 14}" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="select-none filter drop-shadow">${pt.label}</text>` : '';
          circleG.innerHTML = `
            <circle cx="${pt.x}" cy="${pt.y}" r="16" fill="${q.mapData.color}" opacity="0.35" class="map-pulse" />
            <circle cx="${pt.x}" cy="${pt.y}" r="8" fill="${q.mapData.color}" stroke="#ffffff" stroke-width="2" />
            ${labelSvg}
          `;
          svgFeatures.appendChild(circleG);
        });
      } else {
        mapContainer.classList.add('hidden');
      }

      // Şıklar
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600/60 transition flex items-start gap-2.5 text-xs md:text-sm group";
        btn.id = `opt-${idx}`;
        btn.innerHTML = `
          <span class="w-5 h-5 rounded bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-300 group-hover:border-rose-400 shrink-0">
            ${letters[idx]}
          </span>
          <span class="flex-1">${opt}</span>
        `;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('explanation-box').className = "hidden";
      document.getElementById('btn-next').classList.add('hidden');
      lucide.createIcons();
    }

    function selectAnswer(selectedIdx) {
      const q = questionBank[currentIdx];
      const isCorrect = selectedIdx === q.correct;
      solvedCount++;

      if (isCorrect) {
        if (!corrects.includes(q.id)) corrects.push(q.id);
        wrongs = wrongs.filter(id => id !== q.id);
      } else {
        if (!wrongs.includes(q.id)) wrongs.push(q.id);
        corrects = corrects.filter(id => id !== q.id);
      }
      saveState();

      q.options.forEach((_, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        if (idx === q.correct) {
          btn.className = "w-full text-left p-3 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-100 flex items-start gap-2.5 text-xs md:text-sm";
        } else if (idx === selectedIdx && !isCorrect) {
          btn.className = "w-full text-left p-3 rounded-xl bg-rose-950/80 border-2 border-rose-500 text-rose-100 flex items-start gap-2.5 text-xs md:text-sm";
        } else {
          btn.className = "w-full text-left p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 text-slate-500 opacity-60 flex items-start gap-2.5 text-xs md:text-sm";
        }
      });

      const expBox = document.getElementById('explanation-box');
      expBox.className = `p-3.5 rounded-xl border text-xs md:text-sm leading-relaxed ${isCorrect ? 'bg-emerald-900/30 border-emerald-700 text-emerald-200' : 'bg-rose-900/30 border-rose-700 text-rose-200'}`;
      expBox.innerHTML = `
        <div class="font-bold flex items-center gap-1 mb-1">
          <i data-lucide="${isCorrect ? 'check-circle' : 'alert-triangle'}" class="w-4 h-4"></i>
          ${isCorrect ? 'Tebrikler, Doğru Cevap!' : 'Yanlış Cevap!'}
        </div>
        <div>${q.explanation}</div>
      `;
      expBox.classList.remove('hidden');

      document.getElementById('btn-next').classList.remove('hidden');
      lucide.createIcons();
    }

    function nextQuestion() {
      renderQuestion(currentIdx + 1);
    }

    function toggleFavorite() {
      const q = questionBank[currentIdx];
      if (!q) return;

      if (favorites.includes(q.id)) {
        favorites = favorites.filter(id => id !== q.id);
      } else {
        favorites.push(q.id);
      }
      saveState();
      lucide.createIcons();
    }

    function switchTab(tab) {
      const tabs = ['quiz', 'favorites', 'wrongs', 'corrects'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-rose-600 text-white flex items-center gap-1 transition";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center gap-1 transition";
        }
      });

      const viewQuiz = document.getElementById('view-quiz');
      const viewList = document.getElementById('view-list');

      if (tab === 'quiz') {
        viewQuiz.classList.remove('hidden');
        viewList.classList.add('hidden');
      } else {
        viewQuiz.classList.add('hidden');
        viewList.classList.remove('hidden');
        renderFilteredList(tab);
      }
    }

    function renderFilteredList(type) {
      const listContainer = document.getElementById('list-container');
      const listTitle = document.getElementById('list-title');
      listContainer.innerHTML = '';

      let targetIds = type === 'favorites' ? favorites : (type === 'wrongs' ? wrongs : corrects);
      let titleText = type === 'favorites' ? 'Beğenilen Sorular' : (type === 'wrongs' ? 'Yanlış Yapılan Sorular' : 'Doğru Yapılan Sorular');
      
      listTitle.innerHTML = `${titleText} (${targetIds.length})`;

      if (targetIds.length === 0) {
        listContainer.innerHTML = `<div class="p-6 text-center bg-slate-800 rounded-xl border border-slate-700 text-slate-400 text-xs md:text-sm">Henüz bu listede soru bulunmuyor.</div>`;
        return;
      }

      targetIds.forEach(id => {
        const qIndex = questionBank.findIndex(item => item.id === id);
        const q = questionBank[qIndex];
        if (!q) return;

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-3.5 rounded-xl border border-slate-700 space-y-2 hover:border-slate-500 transition";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <span class="text-xs bg-slate-700 text-rose-300 px-2 py-0.5 rounded font-mono">${q.category}</span>
            <button onclick="goToQuestion(${qIndex})" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg">
              Bu Soruyu Çöz
            </button>
          </div>
          <p class="text-xs md:text-sm font-medium text-slate-200 line-clamp-2">${q.text.replace(/<[^>]*>?/gm, '')}</p>
        `;
        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    function goToQuestion(index) {
      switchTab('quiz');
      renderQuestion(index);
    }

    window.onload = () => {
      updateCounters();
      renderQuestion(currentIdx);
      lucide.createIcons();
    };
  </script>
</body>
</html>
